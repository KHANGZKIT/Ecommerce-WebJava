server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cloud:
    gateway:
      routes:
        # ─────────────────────────────────────────────────────────────────────
        # User Service — public auth (no rate limit, no auth filter)
        # ─────────────────────────────────────────────────────────────────────
        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ─────────────────────────────────────────────────────────────────────
        # User Service — protected profile endpoints (rate limited per user)
        # ─────────────────────────────────────────────────────────────────────
        - id: user-service-users
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ─────────────────────────────────────────────────────────────────────
        # Product Service — public browse (rate limited per IP)
        # ─────────────────────────────────────────────────────────────────────
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@publicRateLimiter}"
                key-resolver: "#{@publicApiKeyResolver}"

        # ─────────────────────────────────────────────────────────────────────
        # Cart Service (rate limited per user)
        # ─────────────────────────────────────────────────────────────────────
        - id: cart-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - StripPrefix=0
            - name: AuthenticationFilter
              args:
                requireUserId: true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ─────────────────────────────────────────────────────────────────────
        # Order Service (rate limited per user)
        # ─────────────────────────────────────────────────────────────────────
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ─────────────────────────────────────────────────────────────────────
        # Payment Service (tighter rate limit — fraud prevention)
        # ─────────────────────────────────────────────────────────────────────
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ─────────────────────────────────────────────────────────────────────
        # OpenAPI Docs Proxy Routes (no rate limit — internal tooling only)
        # ─────────────────────────────────────────────────────────────────────
        - id: openapi-user
          uri: http://user-service:8081
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs
        - id: openapi-product
          uri: http://product-service:8082
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - RewritePath=/v3/api-docs/product-service, /v3/api-docs
        - id: openapi-cart
          uri: http://order-service:8084
          predicates:
            - Path=/v3/api-docs/cart-service
          filters:
            - RewritePath=/v3/api-docs/cart-service, /v3/api-docs
        - id: openapi-order
          uri: http://order-service:8084
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs
        - id: openapi-payment
          uri: http://payment-service:8085
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs


      default-filters:
        - AddResponseHeader=X-Gateway-Source, api-gateway
        - AddResponseHeader=X-Content-Type-Options, nosniff

  # Global CORS for all routes
  webflux:
    cors:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in ms

springdoc:
  api-docs:
    version: openapi_3_0
  swagger-ui:
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Product Service
        url: /v3/api-docs/product-service
      - name: Cart Service
        url: /v3/api-docs/cart-service
      - name: Order Service
        url: /v3/api-docs/order-service
      - name: Payment Service
        url: /v3/api-docs/payment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.ecommerce.gateway: DEBUG
