server:
  port: 8085
  tomcat:
    max-swallow-size: 20KB
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://payment-db:5432/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ecommerce.paymentservice: DEBUG

jwt:
  secret: ${JWT_SECRET}

momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn}
  redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment-result}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
  request-type: captureWallet

services:
  order-service:
    url: ${SERVICES_ORDER_SERVICE_URL:http://order-service:8084}

